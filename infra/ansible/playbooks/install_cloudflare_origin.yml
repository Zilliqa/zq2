# ABOUTME: Installs the nginx TLS front that lets Cloudflare reach Otterscan, stats and the faucet directly on the apps VM.
# ABOUTME: Needs the <chain>-cf-origin-cert/-key secrets, cloudflare_origin_* group vars and, for Authenticated Origin Pulls, files/cloudflare-aop-ca.pem.
---
- name: Install the Cloudflare origin for Otterscan and stats
  hosts: role_apps
  become: true
  tags:
    - install
    - all

  vars:
    cloudflare_origin_tls_dir: /etc/nginx/cloudflare-origin

  tasks:
    # Read on the controller with the operator's credentials: the apps VM service account needs no new access.
    - name: Read the Cloudflare origin certificate and key from Secret Manager
      delegate_to: localhost
      become: false
      no_log: true
      ansible.builtin.command: >-
        gcloud secrets versions access latest
        --project={{ project_id }} --secret={{ chain_name }}-cf-origin-{{ item }}
      loop: [cert, key]
      register: cloudflare_origin_secrets
      changed_when: false

    # Fail before touching the VM if the two secrets are not a pair (e.g. one of them was rotated alone).
    - name: Check that the certificate and key match
      delegate_to: localhost
      become: false
      no_log: true
      ansible.builtin.shell: >-
        set -o pipefail;
        test "$(printf '%s\n' "$CERT" | openssl x509 -noout -pubkey | openssl sha256)"
        = "$(printf '%s\n' "$KEY" | openssl pkey -pubout | openssl sha256)"
      args:
        executable: /bin/bash
      environment:
        CERT: "{{ cloudflare_origin_secrets.results[0].stdout }}"
        KEY: "{{ cloudflare_origin_secrets.results[1].stdout }}"
      changed_when: false

    # The nginx package starts its default site on port 80, which Otterscan already uses: keep it stopped until configured.
    - name: Install nginx without starting it
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        policy_rc_d: 101

    - name: Remove the default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Create the Cloudflare origin TLS directory
      ansible.builtin.file:
        path: "{{ cloudflare_origin_tls_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install the Cloudflare origin certificate and key
      no_log: true
      ansible.builtin.copy:
        dest: "{{ cloudflare_origin_tls_dir }}/{{ item.file }}"
        content: "{{ item.content }}\n"
        owner: root
        group: root
        mode: "0600"
      loop:
        - { file: origin.pem, content: "{{ cloudflare_origin_secrets.results[0].stdout }}" }
        - { file: origin.key, content: "{{ cloudflare_origin_secrets.results[1].stdout }}" }
      notify: Reload nginx

    # Public certificate of the CA dedicated to Authenticated Origin Pulls. Cloudflare holds the client leaf and its key;
    # the CA key is not kept: rotating means a new CA here and a new leaf on Cloudflare.
    - name: Install the Authenticated Origin Pulls CA
      when: cloudflare_origin_client_verify | default('')
      ansible.builtin.copy:
        src: files/cloudflare-aop-ca.pem
        dest: "{{ cloudflare_origin_tls_dir }}/cloudflare-aop-ca.pem"
        owner: root
        group: root
        mode: "0644"
        validate: openssl x509 -noout -in %s
      notify: Reload nginx

    - name: Configure the nginx sites for Otterscan and stats
      ansible.builtin.template:
        src: templates/cloudflare_origin_nginx.conf.j2
        dest: /etc/nginx/conf.d/cloudflare-origin.conf
        mode: "0644"
      notify: Reload nginx

    - name: Validate the nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Start and enable nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
